name: Build and publish preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  checks:
    name: Backend lint and copy parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint the WordPress plugin
        run: |
          for file in backend/wp-content/plugins/powpills-core/powpills-core.php \
                      backend/wp-content/plugins/powpills-core/includes/*.php; do
            php -l "$file"
          done

      - name: Frontend and WordPress copy must match word for word
        run: |
          php tools/dump-wp-copy.php
          python3 tools/check-copy-parity.py

  build:
    name: Build and deploy storefront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      # `next build` type checks as part of the build; the explicit tsc pass runs
      # afterwards because it needs the next-env.d.ts that the build generates.
      - name: Build static site
        working-directory: frontend
        run: npm run build
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /powpills-store

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Upload the built site as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: powpills-static-site
          path: frontend/out

      # Publishes to the gh-pages branch. .nojekyll is required so GitHub serves
      # Next.js's _next/ folder instead of letting Jekyll strip it.
      - name: Publish to the gh-pages branch
        working-directory: frontend/out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Preview build from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published $(find . -name '*.html' | wc -l) HTML file(s) to gh-pages"
